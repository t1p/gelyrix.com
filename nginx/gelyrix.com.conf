server {
	listen 80;
	server_name gelyrix.com www.gelyrix.com;

	# Uncomment and configure SSL if needed.
	# listen 443 ssl http2;
	# ssl_certificate /etc/letsencrypt/live/gelyrix.com/fullchain.pem;
	# ssl_certificate_key /etc/letsencrypt/live/gelyrix.com/privkey.pem;

	location / {
		proxy_pass http://127.0.0.1:3000;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}
}
